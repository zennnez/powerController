name: Build & Release Module

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Package Module & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Module Metadata
        id: metadata
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r\n')
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2 | tr -d '\r\n')
          ID=$(grep '^id=' module.prop | cut -d= -f2 | tr -d '\r\n')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "id=${ID}" >> $GITHUB_OUTPUT
          echo "zip_name=${ID}-${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Package Module Zip
        run: |
          ZIP_NAME="${{ steps.metadata.outputs.zip_name }}"
          zip -r "${ZIP_NAME}" . -x ".git/*" ".github/*" ".gitignore" "scratch/*"
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.id }}-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.metadata.outputs.zip_name }}
            ${{ steps.metadata.outputs.zip_name }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "PowerController ${{ steps.metadata.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.metadata.outputs.zip_name }}
            ${{ steps.metadata.outputs.zip_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
